[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-book-agent"
version = "0.1.0"
description = "Local-first Chinese document RAG and bounded research agent"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115,<1.0",
    "chromadb>=1.0,<2.0",
    "httpx>=0.27,<1.0",
    "ddgs>=9.5,<10.0",
    "trafilatura>=2.0,<3.0",
    "playwright>=1.48,<2.0",
    "pypdf>=5.0,<7.0",
    "cryptography>=42.0,<46.0",
    "PyMuPDF>=1.24,<2.0",
    "pymupdf4llm>=0.0.27,<1.0",
    "python-multipart>=0.0.9,<1.0",
    "python-docx>=1.1,<2.0",
    "openpyxl>=3.1,<4.0",
    "xlrd>=2.0,<3.0",
    "python-pptx>=0.6.23,<1.0",
    "rapidocr-onnxruntime>=1.2.3,<2.0",
    "rank-bm25>=0.2,<1.0",
    "sentence-transformers>=3.0,<6.0",
    "langgraph>=1.2.11,<1.3",
    "uvicorn>=0.30,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<10.0",
    "pytest-cov>=5.0,<8.0",
    "ruff>=0.9,<1.0",
]

[project.scripts]
rag-book = "rag_book_agent.cli:main"
rag-book-web = "rag_book_agent.web.app:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]
